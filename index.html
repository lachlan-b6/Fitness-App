:1px solid var(--line);border-radius:19px;padding:16px;min-width:0}.metric .label{font-size:11px;color:var(--muted);line-height:1.3}.metric .value{font-size:26px;letter-spacing:-.9px;font-weight:800;margin:9px 0 3px;white-space:nowrap}.metric .note{font-size:11px;color:var(--lime)}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.pill{display:inline-block;border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:6px 10px;font-size:11px;color:var(--muted)}.pill.good{color:var(--lime);border-color:#526a48}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);border:0;color:#172019;font-weight:800;padding:12px 15px;border-radius:13px;min-height:43px}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--fg)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.sm{padding:8px 11px;min-height:35px;font-size:12px}.btn.full{width:100%}input,select,textarea{width:100%;background:#101c18;border:1px solid #405449;border-radius:12px;color:var(--fg);padding:12px;min-height:44px}input::placeholder,textarea::placeholder{color:#84978d}input[type=date]{color-scheme:dark}input[type=number]{font-variant-numeric:tabular-nums}label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .wide{grid-column:span 2}.progress{height:9px;background:#34453b;border-radius:999px;overflow:hidden}.progress span{height:100%;background:var(--lime);display:block;border-radius:999px;transition:width .25s}.progress-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.workout-item{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}.workout-item:last-child{border:0}.workout-item .num{flex:none;width:27px;height:27px;display:grid;place-items:center;background:#2c4235;color:var(--lime);border-radius:10px;font-weight:800;font-size:11px}.workout-item .left{display:flex;align-items:center;gap:9px;min-width:0}.workout-item b{display:block;font-size:13px}.workout-item small{color:var(--muted);font-size:11px}.workout-item .sets{color:var(--lime);font-size:11px;white-space:nowrap}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#121f1aeF;backdrop-filter:blur(17px);border-top:1px solid var(--line);padding:9px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:center}.tabs-inner{width:min(650px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.tab{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:7px 2px 5px;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:10px}.tab span{font-size:21px;line-height:1.2}.tab.active{background:#273e31;color:var(--lime)}.chiprow{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px}.chip{padding:10px 13px;flex:none;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12px}.chip.active{background:var(--lime);border-color:var(--lime);color:var(--bg)}.callout{font-size:12px;color:#d7e1d8;line-height:1.6;background:#26392e;border-left:3px solid var(--lime);padding:12px 13px;border-radius:6px 12px 12px 6px;margin:13px 0}.chart{width:100%;height:170px;display:block}.linegrid{stroke:#33473b;stroke-width:1}.chartlabel{fill:#9eb3a5;font:11px -apple-system,sans-serif}.footnote{font-size:11px;color:var(--muted);line-height:1.55}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.statline{border-bottom:1px solid var(--line);padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.statline:last-child{border:0}.log-entry{border-bottom:1px solid var(--line);padding:11px 0}.log-entry:last-child{border:0}.log-entry .date{font-size:11px;color:var(--muted)}.log-entry b{font-size:14px}.remove{background:transparent;border:0;color:var(--red);padding:4px 6px}.checkrow{display:flex;gap:9px;align-items:center;padding:8px 0;color:var(--fg);font-size:13px}.checkrow input{width:17px;min-height:0;height:17px;accent-color:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}.empty{font-size:13px;color:var(--muted);padding:14px 0}.modal-backdrop{position:fixed;inset:0;background:#020705d9;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#1b2c24;border:1px solid #4d6956;border-radius:24px 24px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 8px;font-size:22px}.exercise-log{border-bottom:1px solid var(--line);padding:12px 0}.exercise-log:last-child{border:0}.setrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:9px;align-items:center;margin-top:8px}.setrow small{color:var(--muted)}.setrow input{padding:9px;min-height:40px}.upload{position:relative;overflow:hidden}.upload input{position:absolute;opacity:0;inset:0;cursor:pointer}.fineprint{color:#8fa99a;font-size:11px;line-height:1.5}.warning{color:var(--orange)}@media(min-width:650px){#app{padding-top:38px}.tabs{bottom:12px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-radius:22px;padding:8px;width:630px}.modal-backdrop{align-items:center}.modal{border-radius:24px;max-height:85vh}}

</style></head><body><main id="app"></main><nav class="tabs" aria-label="Main navigation"><div class="tabs-inner" id="tabbar"></div></nav><div id="modalroot"></div><script>
'use strict';
const KEY='lachlan_fitness_hub_v1';
let WORKOUTS=[{id:'A',name:'Full Body A',focus:'Chest, back & quads',weekday:'Monday',exercises:[['Goblet squat',2,'8–12'],['Dumbbell bench press',2,'8–12'],['One-arm dumbbell row',2,'10–12 / side'],['Dumbbell Romanian deadlift',2,'8–12'],['Dumbbell lateral raise',2,'12–15'],['Plank',2,'20–40 sec']]},{id:'B',name:'Full Body B',focus:'Legs, shoulders & arms',weekday:'Wednesday',exercises:[['Trap-bar deadlift',2,'6–8'],['Dumbbell shoulder press',2,'8–12'],['Band-assisted pull-up or band row',2,'8–12'],['Split squat',2,'8–10 / side'],['Dumbbell biceps curl',2,'10–15'],['Dumbbell triceps extension',2,'10–15']]},{id:'C',name:'Full Body C',focus:'Full-body strength',weekday:'Friday',exercises:[['Goblet squat',2,'10–12'],['Incline dumbbell press',2,'8–12'],['Barbell row',2,'8–12'],['Dumbbell hip thrust',2,'10–15'],['Dumbbell lateral raise',2,'12–15'],['Dead bug',2,'8–10 / side']]}];
const defaults={profile:{weight:95.8,bodyFat:26.8,fatMass:25.7,muscleMass:67.7,leanMass:71.3,steps:6920,goalBodyFat:15,proteinGoal:140,stepGoal:8000,waterGoal:2500},measurements:[{date:'2026-11-15',weight:95.8,bodyFat:26.8,muscle:67.7,waist:null}],meals:[],workoutLogs:[],water:[],steps:[],notes:[],createdAt:new Date().toISOString()};
const ORIGINAL_WORKOUTS=structuredClone(WORKOUTS);function load(){try{let stored=JSON.parse(localStorage.getItem(KEY));if(stored&&stored.profile)return {...structuredClone(defaults),...stored,profile:{...defaults.profile,...stored.profile}}}catch(e){}return structuredClone(defaults)}let state=load(),tab='home',chosenWorkout='A',modal=null;
function save(){state.customWorkouts=WORKOUTS;localStorage.setItem(KEY,JSON.stringify(state))}
const WEEKDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const ACTIVITY_TYPES=['Strength','Swimming','Water polo','Cycling','Pilates','Running','Walking','Other'];
function activityType(w){return ACTIVITY_TYPES.includes(w.type)?w.type:'Strength'}
function validWorkouts(plan){
 if(!Array.isArray(plan)||plan.length<1||plan.length>20)throw Error('Include between 1 and 20 sessions.');
 const ids=new Set();
 return plan.map((w,i)=>{
  if(!w||typeof w.id!=='string'||!/^[A-Za-z0-9_-]{1,30}$/.test(w.id)||ids.has(w.id))throw Error('Each session needs a unique ID.');
  ids.add(w.id);
  if(typeof w.name!=='string'||!w.name.trim()||w.name.length>90||typeof w.focus!=='string'||w.focus.length>150)throw Error('Invalid name or description for '+w.id);
  const day=WEEKDAYS.includes(w.weekday)?w.weekday:'Unscheduled';
  const type=activityType(w);
  const exercises=Array.isArray(w.exercises)?w.exercises:[];
  if(exercises.length>15||(type==='Strength'&&exercises.length<1))throw Error('Strength workouts need 1–15 exercises; other sessions may have none.');
  return {id:w.id,name:w.name.trim(),focus:w.focus.trim(),weekday:day,type,exercises:exercises.map(e=>{
   if(!Array.isArray(e)||e.length<3||typeof e[0]!=='string'||!e[0].trim()||e[0].length>90||!Number.isInteger(Number(e[1]))||Number(e[1])<1||Number(e[1])>6||!String(e[2]).trim()||String(e[2]).length>35)throw Error('Invalid exercise in '+w.id);
   return [e[0].trim(),Number(e[1]),String(e[2]).trim()];
  })};
 });
}
function daySelect(selected){return ['Unscheduled',...WEEKDAYS].map(d=>`<option value="${d}" ${selected===d?'selected':''}>${d}</option>`).join('')}
function typeSelect(selected){return ACTIVITY_TYPES.map(t=>`<option value="${t}" ${selected===t?'selected':''}>${t}</option>`).join('')}
function sortScheduled(list){return list.slice().sort((a,b)=>{let x=WEEKDAYS.indexOf(a.weekday),y=WEEKDAYS.indexOf(b.weekday);return (x<0?7:x)-(y<0?7:y)})}
function getRecommended(){const todayDay=WEEKDAYS[(new Date().getDay()+6)%7];return WORKOUTS.find(w=>w.weekday===todayDay)||sortScheduled(WORKOUTS)[0]}
function activityEditor(){const w=modal.type==='addActivity'?{id:'',name:'',focus:'',weekday:'Unscheduled',type:'Swimming',exercises:[]}:WORKOUTS.find(x=>x.id===modal.id);const fresh=modal.type==='addActivity';return `<h2>${fresh?'Add a session':'Edit '+escapeHTML(w.name)}</h2><p class="subtitle">Choose any day or leave it unscheduled. Strength workouts use exercise sets; swimming, water polo, cycling and other activities can be logged by duration or distance.</p><form id="activityForm" class="stack"><div><label>Session name</label><input name="name" maxlength="90" required placeholder="e.g. Sunday morning swim" value="${escapeHTML(w.name)}"></div><div class="form-grid"><div><label>Activity</label><select name="type">${typeSelect(activityType(w))}</select></div><div><label>Scheduled day</label><select name="weekday">${daySelect(w.weekday)}</select></div></div><div><label>Notes / training focus</label><input name="focus" maxlength="150" placeholder="Optional" value="${escapeHTML(w.focus)}"></div><div><label>Exercises (for strength sessions)</label><textarea name="exercises" rows="7" placeholder="Goblet squat | 2 | 8–12
Dumbbell row | 2 | 10–12">${escapeHTML(w.exercises.map(e=>e.join(' | ')).join('\n'))}</textarea><p class="fineprint">One exercise per line: Name | Sets | Reps. For swimming, water polo, bike or Pilates, exercises are optional.</p></div><button class="btn full" type="submit">${fresh?'Add session':'Save changes'}</button></form>${fresh?'':`<button class="btn ghost full" type="button" style="margin-top:10px" id="deleteActivity">Remove session</button>`}`}
try{if(state.customWorkouts)WORKOUTS=validWorkouts(state.customWorkouts)}catch(e){console.warn('Saved workout program invalid:',e)}
function workoutEditor(){return activityEditor()}
function planTools(){return `<div class="card"><h2 style="margin-top:0">Manage your training schedule</h2><p class="subtitle">Move sessions to different days, add strength or sports activities, and keep completed logs. Ask ChatGPT to rewrite your entire plan if you like.</p><button class="btn full" data-modal="addActivity" type="button">+ Add a workout or activity</button><div class="stack" style="margin-top:12px"><button class="btn secondary full" id="copyPlan">Copy schedule for ChatGPT</button><label for="planJson">Import a revised program (JSON)</label><textarea id="planJson" rows="4" placeholder='Paste an array of sessions with id, name, type, weekday, focus and exercises'></textarea><button class="btn secondary full" id="applyPlan">Import revised schedule</button><button class="btn ghost full" id="resetAllWorkouts">Restore original three strength sessions</button></div></div>`}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v,dec=0){return typeof v==='number'&&isFinite(v)?v.toFixed(dec):'—'}function sum(arr,k){return arr.reduce((s,a)=>s+(Number(a[k])||0),0)}function currentMeasurement(){return [...state.measurements].sort((a,b)=>a.date.localeCompare(b.date)).at(-1)||{weight:95.8,bodyFat:26.8}}function dailyMeals(date=today()){return state.meals.filter(m=>m.date===date)}function dailyWater(date=today()){return sum(state.water.filter(w=>w.date===date),'ml')}function dailySteps(date=today()){return state.steps.filter(w=>w.date===date).at(-1)?.count||0}function currentProtein(){return sum(dailyMeals(),'protein')}function render(){const labels=[['home','⌂','Today'],['workouts','◫','Train'],['progress','↗','Progress'],['nutrition','◉','Food'],['settings','⚙','More']];document.getElementById('tabbar').innerHTML=labels.map(([id,icon,title])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}" aria-label="${title}" aria-current="${tab===id?'page':'false'}"><span>${icon}</span>${title}</button>`).join('');let map={home:renderHome,workouts:renderWorkouts,progress:renderProgress,nutrition:renderNutrition,settings:renderSettings};document.getElementById('app').innerHTML=map[tab]();bind();renderModal()}function heading(name,desc){return `<div class="topline"><div><div class="eyebrow">Lachlan's fitness hub</div><h1 class="brand">${name}</h1><div class="subtitle">${desc}</div></div><div class="avatar">L</div></div>`}function metric(label,val,note){return `<div class="metric"><div class="label">${label}</div><div class="value">${val}</div><div class="note">${note}</div></div>`}function progressBar(value,goal){return `<div class="progress"><span style="width:${Math.min(100,Math.max(0,goal?value/goal*100:0))}%"></span></div>`}function prettyDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})}function renderHome(){let m=currentMeasurement(),p=state.profile,protein=currentProtein(),water=dailyWater(),steps=dailySteps(),recent=state.workoutLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,1)[0],recommended=WORKOUTS.find(w=>w.id===getRecommended());return heading('Your daily game plan','Build strength. Lose fat. Stay consistent.')+`<section class="card hero"><span class="tag">LEAN & ATHLETIC • 15% BODY FAT GOAL</span><h1>${num(m.weight,1)} <span style="font-size:22px">kg</span></h1><div class="subtitle" style="color:#d5e3d4">Current logged weight · estimated body fat ${num(m.bodyFat,1)}%</div><div class="divider"></div><div class="row"><span class="small">Your target is body composition, not just scale weight.</span><button class="btn sm" data-modal="measure">+ Weigh in</button></div></section><div class="section-head"><h2>Today at a glance</h2><small>${prettyDate(today())}</small></div><div class="grid2">${metric('Protein',`${num(protein)} / ${p.proteinGoal} g`,`${Math.max(0,p.proteinGoal-protein)} g remaining`)}${metric('Water',`${(water/1000).toFixed(1)} L`,`${(p.waterGoal/1000).toFixed(1)} L daily goal`)}${metric('Steps',`${steps||'—'}`,`Goal ${p.stepGoal.toLocaleString()}`)}${metric('Workouts logged',`${state.workoutLogs.length}`,`Total completed`)}</div><div class="card"><div class="progress-label"><b>Protein today</b><span>${Math.round(protein/Math.max(1,p.proteinGoal)*100)}%</span></div>${progressBar(protein,p.proteinGoal)}<div class="row" style="margin-top:13px"><button class="btn sm secondary" data-tab="nutrition">+ Log food</button><button class="btn sm secondary" data-water="250">+ 250 mL water</button></div></div><div class="section-head"><h2>Next workout</h2><small>Flexible schedule</small></div><div class="card"><div class="row top"><div><span class="pill good">${recommended.weekday}</span><h2 style="margin:10px 0 4px">${recommended.name}</h2><div class="subtitle">${escapeHTML(activityType(recommended))} · ${escapeHTML(recommended.focus)}${recommended.exercises.length?` · ${recommended.exercises.length} exercises`:``}</div></div><span style="font-size:32px;color:var(--lime)">↗</span></div><button class="btn full" style="margin-top:17px" data-start="${recommended.id}">Start workout</button></div><div class="callout"><b>Your key priority:</b> Rebuild lifting consistency while eating enough protein. Your Withings scale estimated a 2.4 kg muscle-mass decline during its report period, but hydration changes affect these readings.</div>${recent?`<div class="section-head"><h2>Last session</h2></div><div class="card row"><div><b>${escapeHTML(recent.name)}</b><div class="subtitle">${prettyDate(recent.date)} · ${recent.entries.length} exercises logged</div></div><span class="pill good">Completed</span></div>`:''}`}
function renderWorkouts(){
 const scheduled=sortScheduled(WORKOUTS);const w=WORKOUTS.find(x=>x.id===chosenWorkout)||scheduled[0];if(w)chosenWorkout=w.id;
 return heading('Your training','Your flexible weekly workout & activity schedule')+
 `<div class="card"><div class="row"><b>Your weekly schedule</b><span class="pill">${WORKOUTS.length} sessions</span></div><div class="chiprow" style="margin-top:12px">${scheduled.map(x=>`<button class="chip ${x.id===chosenWorkout?'active':''}" data-workout="${escapeHTML(x.id)}">${escapeHTML(x.weekday)} · ${escapeHTML(x.name)}</button>`).join('')}</div><button class="btn full" data-modal="addActivity" type="button">+ Add a session</button></div>`+
 (w?`<div class="card hero"><span class="tag">${escapeHTML(w.weekday.toUpperCase())} · ${escapeHTML(activityType(w).toUpperCase())}</span><h1 style="font-size:30px">${escapeHTML(w.name)}</h1><div class="subtitle">${escapeHTML(w.focus||activityType(w))}</div><div class="grid2" style="margin-top:18px"><button class="btn" data-start="${escapeHTML(w.id)}">Log session</button><button class="btn secondary" data-edit-workout="${escapeHTML(w.id)}">Edit / move</button></div></div>`+
 (w.exercises.length?`<div class="section-head"><h2>Exercises</h2><small>Adjust anytime</small></div><div class="card">${w.exercises.map((e,i)=>`<div class="workout-item"><div class="left"><span class="num">${i+1}</span><div><b>${escapeHTML(e[0])}</b></div></div><span class="sets">${e[1]} × ${escapeHTML(e[2])}</span></div>`).join('')}</div>`:`<div class="callout">Log your ${escapeHTML(activityType(w).toLowerCase())} by duration, distance and optional notes.</div>`):'')+
 planTools()+`<div class="section-head"><h2>Recent sessions</h2></div><div class="card">${state.workoutLogs.length?state.workoutLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="log-entry row"><div><b>${escapeHTML(x.name)}</b><div class="date">${prettyDate(x.date)} · ${escapeHTML(x.type||'Strength')}${x.duration?` · ${num(Number(x.duration))} min`:''}${x.distance?` · ${num(Number(x.distance),1)} km`:''}</div></div><button class="remove" aria-label="Delete workout" data-remove-workout="${escapeHTML(x.id)}">Delete</button></div>`).join(''):`<div class="empty">Your completed sessions appear here.</div>`}</div>`;
}
let chartRange='90';
function withingsDateLabel(s){if(!s)return 'Not yet synced';try{return new Date(s).toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}catch{return 'Not yet synced'}}
function latestFor(key){return state.measurements.filter(m=>typeof m[key]==='number'&&Number.isFinite(m[key])).slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)}
function formatChange(value,digits=1,unit=''){return Number.isFinite(value)?(value>0?'+':'')+value.toFixed(digits)+unit:'—'}
function chartPoints(key){
 let rows=state.measurements.filter(m=>typeof m[key]==='number'&&Number.isFinite(m[key])&&m.date).slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(chartRange!=='all'&&rows.length){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-Number(chartRange));const date=cutoff.toISOString().slice(0,10);rows=rows.filter(m=>m.date>=date)}
 return rows;
}
function chartSVG(rows,key,unit){
 const points=chartPoints(key);
 if(!points.length)return '<p class="empty">No measurements in this period. Select All or add a new reading.</p>';
 const vals=points.map(p=>p[key]),first=points[0],last=points.at(-1);
 let min=Math.min(...vals),max=Math.max(...vals);const pad=Math.max(key==='weight'?.35:.15,(max-min)*.18);min-=pad;max+=pad;
 const coord=(p,i)=>({x:34+i*267/Math.max(1,points.length-1),y:141-(p[key]-min)/(max-min)*112});
 const coords=points.map(coord),fmt=x=>Number(x).toFixed(key==='weight'?2:1);
 const line=coords.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
 const dots=coords.map((p,i)=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(i===coords.length-1?4.7:2.7)+'" fill="#c5ef83"><title>'+escapeHTML(points[i].date+': '+fmt(vals[i])+' '+unit)+'</title></circle>').join('');
 return '<svg class="chart" viewBox="0 0 335 170" role="img" aria-label="'+escapeHTML(key)+' trend, '+points.length+' readings from '+first.date+' to '+last.date+'">'+
 '<line class="linegrid" x1="34" y1="20" x2="301" y2="20"/><line class="linegrid" x1="34" y1="82" x2="301" y2="82"/><line class="linegrid" x1="34" y1="141" x2="301" y2="141"/>'+
 '<text class="chartlabel" x="1" y="24">'+max.toFixed(1)+'</text><text class="chartlabel" x="1" y="145">'+min.toFixed(1)+'</text>'+
 '<polyline fill="none" stroke="#c5ef83" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'+dots+
 '<text class="chartlabel" x="34" y="165">'+prettyDate(first.date)+'</text><text class="chartlabel" x="301" y="165" text-anchor="end">'+prettyDate(last.date)+'</text></svg>'+
 '<p class="chart-summary">'+points.length+' readings · '+fmt(first[key])+ ' → '+fmt(last[key])+' '+unit+' · Change '+formatChange(last[key]-first[key],key==='weight'?2:1,' '+unit)+'</p>';
}
function progressChart(title,key,unit){return '<div class="card"><div class="row"><h2 style="margin:0">'+title+'</h2><span class="pill">'+unit+'</span></div>'+chartSVG(state.measurements,key,unit)+'</div>'}
function renderProgress(){
 const m=currentMeasurement(),latestWeight=latestFor('weight')||m,latestFat=latestFor('bodyFat'),latestMuscle=latestFor('muscle');
 const weights=state.measurements.filter(x=>typeof x.weight==='number'&&Number.isFinite(x.weight)).slice().sort((a,b)=>a.date.localeCompare(b.date));
 const start=weights[0],current=weights.at(-1),lost=start&&current?start.weight-current.weight:null;
 const goal=state.profile.goalBodyFat;
 const fat=latestFat?.bodyFat,remaining=Number.isFinite(fat)?fat-goal:null;
 const lean=Number.isFinite(fat)?current.weight*(1-fat/100):null;
 const target=lean!=null?lean/(1-goal/100):null;
 const label='Latest scale reading: '+(current?prettyDate(current.date):'none')+(state.withingsLastSync?' · Synced '+withingsDateLabel(state.withingsLastSync):' · Not synced automatically yet');

 metric('Estimated muscle mass',latestMuscle?num(latestMuscle.muscle,1)+' kg':'—',latestMuscle?prettyDate(latestMuscle.date):'Not recorded')+
 metric('Weight change',lost===null?'—':formatChange(-lost,2,' kg'),start?'Since '+prettyDate(start.date):'Add measurements')+'</div>'+
 '<div class="card"><h2 style="margin-top:0">Body composition summary</h2>'+
 '<div class="statline"><span class="muted">Starting measurement</span><b>'+(start?num(start.weight,2)+' kg · '+prettyDate(start.date):'—')+'</b></div>'+
 '<div class="statline"><span class="muted">Latest weight</span><b>'+(current?num(current.weight,2)+' kg':'—')+'</b></div>'+
 '<div class="statline"><span class="muted">Total weight '+(lost>=0?'lost':'change')+'</span><b>'+(lost===null?'—':(lost>=0?num(lost,2)+' kg lost':num(-lost,2)+' kg gained'))+'</b></div>'+
 '<div class="statline"><span class="muted">Body fat target</span><b>'+goal+'%</b></div>'+

 '<div class="card"><b>Chart period</b><div class="chart-range" role="group" aria-label="Chart period">'+

 '<div class="callout">Focus on trends, training strength and waist changes. Body-fat and muscle readings are estimates and can fluctuate with hydration.</div>'+

}

async function lookupFoodBarcode(code){code=String(code||'').replace(/\D/g,'');if(!/^\d{8,14}$/.test(code)){nutritionStatus('Enter a valid 8–14 digit barcode.');return}nutritionStatus('Looking up product…');barcodeProduct=null;try{
  const response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'?fields=code,product_name,brands,nutriments,serving_size',{headers:{Accept:'application/json'}});
  if(!response.ok)throw new Error('Lookup unavailable ('+response.status+').');
  const data=await response.json();if(data.status!==1||!data.product)throw new Error('Product not found in Open Food Facts. You can log it manually.');
  const q=data.product,n=q.nutriments||{};
  const kcal=n['energy-kcal_100g']!=null?Number(n['energy-kcal_100g']):n['energy-kj_100g']!=null?Number(n['energy-kj_100g'])/4.184:null;
  const protein=n.proteins_100g!=null?Number(n.proteins_100g):null;
  if(!Number.isFinite(kcal)&&!Number.isFinite(protein))throw new Error('This product has no usable nutrition data. Log it manually.');
  barcodeProduct={code,name:q.product_name||'Packaged food',brand:q.brands||'',kcal100:Number.isFinite(kcal)?kcal:null,protein100:Number.isFinite(protein)?protein:null};
  nutritionStatus('Found product. Confirm its details and enter the amount you ate.');
  document.getElementById('barcodeProductDetails').innerHTML=scannedMealForm();bindBarcodeProduct();
}catch(err){nutritionStatus(err.message||'Lookup failed.');}}

const WITHINGS_API='https://lachlans-fitness-api.lachlan-5ba.workers.dev';
const SYNC_KEY_STORAGE='lachlan_withings_remembered_key_v1';
let withingsKey=localStorage.getItem(SYNC_KEY_STORAGE)||'',withingsMessage='',withingsBusy=false;
let withingsLastAttempt=0;

function withingsPanel(){const remembered=!!localStorage.getItem(SYNC_KEY_STORAGE);return `<div class="card"><h2 style="margin-top:0">Withings scale sync</h2><p class="subtitle">Import scale measurements. Optional automatic refresh on opening this app and after returning to it.</p><label for="withingsSyncKey">Fitness Sync Key (not your Withings password)</label><input id="withingsSyncKey" type="password" autocomplete="off" placeholder="Enter your private Cloudflare sync key" value="${escapeHTML(withingsKey)}"><label class="checkrow" style="margin:10px 0"><input id="rememberWithingsKey" type="checkbox" ${remembered?'checked':''}>Remember key on this device for automatic sync</label><p class="fineprint">Enable this only on your private phone. Remembering the key stores it in this app's local browser storage, where anyone with access to your unlocked device or site data may retrieve it. The key is not included in app backups. Uncheck to forget it.</p><div class="grid2" style="margin-top:12px"><button id="withingsConnect" class="btn secondary" type="button" ${withingsBusy?'disabled':''}>Connect Withings</button><button id="withingsSync" class="btn" type="button" ${withingsBusy?'disabled':''}>Sync measurements</button></div><button id="withingsStatus" class="btn ghost full" type="button" style="margin-top:9px" ${withingsBusy?'disabled':''}>Check connection</button>${withingsMessage?`<p class="callout" role="status">${escapeHTML(withingsMessage)}</p>`:''}<p class="footnote">Last successful sync: ${escapeHTML(withingsDateLabel(state.withingsLastSync))}. The app checks for new readings when opened or resumed, no more than once every 30 minutes. Your Withings OAuth tokens stay on Cloudflare; imported readings remain local to this device.</p></div>`}

async function withingsRequest(path,method='GET'){
 if(!withingsKey)throw new Error('Enter your Fitness Sync Key first.');
 const response=await fetch(WITHINGS_API+path,{method,headers:{Authorization:'Bearer '+withingsKey},cache:'no-store'});
 let data;try{data=await response.json()}catch{throw new Error('Could not read API response.')}
 if(!response.ok)throw new Error(data.error||('API error '+response.status));return data;
}
function importWithingsMeasurements(data){
 if(!Array.isArray(data.measurements))throw new Error('Unexpected measurements response.');
 let count=0;
 for(const m of data.measurements){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(m.date)||!Number.isFinite(m.weight)||m.weight<30||m.weight>350)continue;
  const old=state.measurements.find(x=>x.date===m.date);
  const update={date:m.date,weight:m.weight,source:'withings'};
  if(Number.isFinite(m.bodyFat)&&m.bodyFat>=2&&m.bodyFat<=70)update.bodyFat=m.bodyFat;
  if(Number.isFinite(m.muscle)&&m.muscle>=10&&m.muscle<=180)update.muscle=m.muscle;
  if(old)Object.assign(old,update);else state.measurements.push({...update,waist:null,id:'withings-'+m.date});
  count++;
 }
 state.withingsLastSync=data.syncedAt||new Date().toISOString();
 save();return count;
}
async function withingsAction(action,automatic=false){
 if(withingsBusy)return;
 if(!automatic){const field=document.getElementById('withingsSyncKey');if(field)withingsKey=field.value.trim()}
 if(automatic&&!withingsKey)return;
 withingsBusy=true;if(!automatic){withingsMessage='Contacting Withings…';render()}
 try{
  if(action==='connect'){
   const data=await withingsRequest('/api/connect','POST');const u=new URL(data.authorization_url);
   if(u.protocol!=='https:'||u.hostname!=='account.withings.com')throw new Error('Unexpected authorisation URL.');
   location.assign(u.href);return;
  }
  if(action==='status'){
   const data=await withingsRequest('/api/status');withingsMessage=data.connected?'Withings connected. Tap Sync measurements.':'Not connected yet. Tap Connect Withings.';
  }
  if(action==='sync'){
   const data=await withingsRequest('/api/measurements');const count=importWithingsMeasurements(data);
   withingsMessage=(automatic?'Automatic sync complete. ':'Sync complete. ')+count+' dated measurements imported or updated.';
  }
 }catch(e){withingsMessage='Withings: '+(e.message||'Connection failed');}
 finally{withingsBusy=false;render()}
}
function maybeAutoSync(){
 if(!localStorage.getItem(SYNC_KEY_STORAGE)||!withingsKey||withingsBusy)return;
 if(Date.now()-withingsLastAttempt<30*60*1000)return;
 withingsLastAttempt=Date.now();withingsAction('sync',true);
}

async function googleAction(action){
 if(googleBusy)return;
 const key=document.getElementById('withingsSyncKey');if(key)withingsKey=key.value.trim();
 googleBusy=true;googleMessage='Contacting Google Health…';render();
 try{
  if(action==='connect'){
   const data=await withingsRequest('/api/google/connect','POST');
   const target=new URL(data.authorization_url);
   if(target.protocol!=='https:'||target.hostname!=='accounts.google.com')throw Error('Unexpected Google sign-in address.');
   window.location.assign(target.href);return;
  }
  if(action==='status'){
   const data=await withingsRequest('/api/google/status');
   googleMessage=data.connected?'Google Health is connected. Tap Sync steps.':'Not connected yet. Tap Connect Google Health.';
  }

   }

}

margin-top:15px"><button class="btn secondary full" id="exportBtn">↓ Export backup (JSON)</button><label class="btn secondary full upload" style="color:var(--fg);margin:0">↑ Import backup (JSON)<input id="importFile" type="file" accept="application/json,.json"></label><button class="btn ghost full" id="clearBtn">Reset all locally saved entries</button></div></div><p class="footnote">This is a self-tracking tool, not medical advice or a medical device. Body fat values are approximate. Always follow your healthcare professional's instructions regarding Mounjaro and nutrition.</p>`}
function renderModal(){let root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let html='';if(modal.type==='editWorkout'||modal.type==='addActivity'){html=activityEditor()}else if(modal.type==='barcode'){html=barcodeForm()}else if(modal.type==='foodPhoto'){html=foodPhotoForm()}else if(modal.type==='measure'){let m=currentMeasurement();html=`<h2>Add measurement</h2><p class="subtitle">Morning weigh-ins under consistent conditions are most useful.</p><form id="measureForm" class="form-grid"><div class="wide"><label>Date</label><input name="date" type="date" value="${today()}" max="${today()}" required></div><div><label>Weight (kg) *</label><input name="weight" type="number" step="0.1" min="30" max="350" placeholder="e.g. 95.4" required></div><div><label>Body fat (%)</label><input name="bodyFat" type="number" step="0.1" min="2" max="70" placeholder="Optional"></div><div><label>Muscle mass (kg)</label><input name="muscle" type="number" step="0.1" min="10" max="180" placeholder="Optional"></div><div><label>Waist (cm)</label><input name="waist" type="number" step="0.1" min="40" max="200" placeholder="Optional"></div><button class="btn wide" type="submit">Save measurement</button></form>`}else if(modal.type==='meal'){html=`<h2>Log food</h2><p class="subtitle">Approximate amounts are fine. Calories and protein must be entered manually.</p><form id="mealForm" class="form-grid"><div class="wide"><label>Food / drink</label><input name="name" placeholder="e.g. Chicken & rice, protein shake" maxlength="90" value="${escapeHTML(modal.prefill?.name||'')}" required></div><div><label>Protein (g)</label><input type="number" name="protein" min="0" max="300" step="0.1" placeholder="e.g. 40" value="${escapeHTML(modal.prefill?.protein??'')}" required></div><div><label>Calories (kcal)</label><input type="number" name="calories" min="0" max="5000" step="1" placeholder="e.g. 500" value="${escapeHTML(modal.prefill?.calories??'')}" required></div><div class="wide"><label>Date</label><input type="date" name="date" value="${today()}" required></div><button class="btn wide" type="submit">Save food entry</button></form>`}else if(modal.type==='steps'){html=`<h2>Log steps</h2><form id="stepForm" class="stack"><div><label>Steps today</label><input name="count" type="number" min="0" max="100000" placeholder="e.g. 7800" required></div><button class="btn full" type="submit">Save steps</button></form>`}else if(modal.type==='workout'){let w=WORKOUTS.find(x=>x.id===modal.id);html=`<h2>${escapeHTML(w.name)}</h2><p class="subtitle">${escapeHTML(activityType(w))} session. Record your work, or log time and distance for sport and cardio.</p><form id="workoutForm"><label>Date</label><input name="date" type="date" value="${today()}" required><div class="form-grid"><div><label>Duration (minutes)</label><input name="duration" type="number" min="0" max="1440" step="1" placeholder="e.g. 45"></div><div><label>Distance (km)</label><input name="distance" type="number" min="0" max="1000" step="0.01" placeholder="Optional"></div><div class="wide"><label>Notes</label><textarea name="notes" rows="2" maxlength="500" placeholder="Pace, how you felt, session details"></textarea></div></div>${w.exercises.map((e,i)=>`<div class="exercise-log"><b>${escapeHTML(e[0])}</b><div class="subtitle">${e[1]} sets · target ${e[2]}</div>${Array.from({length:e[1]},(_,j)=>`<div class="setrow"><small>Set ${j+1}</small><input aria-label="Weight for ${escapeHTML(e[0])} set ${j+1}" name="w_${i}_${j}" type="number" min="0" max="600" step="0.5" placeholder="kg"><input aria-label="Reps or seconds for ${escapeHTML(e[0])} set ${j+1}" name="r_${i}_${j}" type="number" min="0" max="300" step="1" placeholder="reps/sec"></div>`).join('')}</div>`).join('')}<button class="btn full" style="margin-top:16px" type="submit">Complete & save workout</button></form>`}root.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="row" style="margin-bottom:12px"><div class="eyebrow">Log your progress</div><button class="btn sm ghost" id="closeModal" type="button">✕ Close</button></div>${html}</section></div>`;let forms=['measureForm','mealForm','stepForm','workoutForm','editWorkoutForm','activityForm'];forms.forEach(id=>{let node=document.getElementById(id);if(node)node.addEventListener('submit',handleForm)});bindFoodModal();
 const closeButton=document.getElementById('closeModal');

function handleForm(ev){ev.preventDefault();const form=ev.currentTarget,f=new FormData(form),id=form.id,uuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);if(id==='activityForm'||id==='editWorkoutForm'){
 try{
 const fresh=modal.type==='addActivity';const existing=WORKOUTS.find(w=>w.id===modal.id);
 const name=String(f.get('name')||'').trim();const type=String(f.get('type')||'Strength');const weekday=String(f.get('weekday')||'Unscheduled');

 const exercises=lines.map(line=>{const parts=line.split('|').map(x=>x.trim());if(parts.length!==3)throw Error('Each exercise needs Name | Sets | Reps');return [parts[0],Number(parts[1]),parts[2]]});
 const newId=fresh?'custom_'+Date.now().toString(36):existing.id;
 const item={id:newId,name,focus:String(f.get('focus')||''),type,weekday,exercises};
 WORKOUTS=validWorkouts(fresh?[...WORKOUTS,item]:WORKOUTS.map(w=>w.id===newId?item:w));
 chosenWorkout=newId;save();modal=null;tab='workouts';render();return;
 }catch(err){alert('Unable to save: '+err.message);return}
 }else if(id==='measureForm'){let entry={id:uuid(),date:f.get('date'),weight:Number(f.get('weight')),bodyFat:f.get('bodyFat')===''?null:Number(f.get('bodyFat')),muscle:f.get('muscle')===''?null:Number(f.get('muscle')),waist:f.get('waist')===''?null:Number(f.get('waist'))};state.measurements.push(entry);tab='progress'}else if(id==='mealForm'){state.meals.push({id:uuid(),name:String(f.get('name')).trim(),protein:Number(f.get('protein')),calories:Number(f.get('calories')),date:f.get('date')});tab='nutrition'}else if(id==='stepForm'){state.steps=state.steps.filter(x=>x.date!==today());state.steps.push({date:today(),count:Number(f.get('count'))});tab='nutrition'}else if(id==='workoutForm'){let w=WORKOUTS.find(x=>x.id===modal.id),entries=w.exercises.map((e,i)=>({name:e[0],sets:Array.from({length:e[1]},(_,j)=>({weight:Number(f.get(`w_${i}_${j}`))||0,reps:Number(f.get(`r_${i}_${j}`))||0}))}));state.workoutLogs.push({id:uuid(),date:f.get('date'),name:w.name,type:activityType(w),workoutId:w.id,entries,duration:Number(f.get('duration'))||0,distance:Number(f.get('distance'))||0,notes:String(f.get('notes')||'').slice(0,500)});tab='workouts'}save();modal=null;render()}

 for(const [id,action] of [['withingsConnect','connect'],['withingsSync','sync'],['withingsStatus','status']]){const el=document.getElementById(id);if(el)el.onclick=()=>withingsAction(action)};document.querySelectorAll('[data-edit-workout]').forEach(el=>el.onclick=()=>{modal={type:'editWorkout',id:el.dataset.editWorkout};renderModal()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render();window.scrollTo(0,0)});document.querySelectorAll('[data-workout]').forEach(el=>el.onclick=()=>{chosenWorkout=el.dataset.workout;render()});document.querySelectorAll('[data-modal]').forEach(el=>el.onclick=()=>{modal={type:el.dataset.modal};renderModal()});document.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>{chosenWorkout=el.dataset.start;modal={type:'workout',id:chosenWorkout};renderModal()});document.querySelectorAll('[data-water]').forEach(el=>el.onclick=()=>{state.water.push({id:Date.now().toString(36)+Math.random(),date:today(),ml:Number(el.dataset.water)});save();render()});document.querySelectorAll('[data-remove-meal]').forEach(el=>el.onclick=()=>{if(confirm('Delete this food entry?')){state.meals=state.meals.filter(x=>x.id!==el.dataset.removeMeal);save();render()}});document.querySelectorAll('[data-remove-workout]').forEach(el=>el.onclick=()=>{if(confirm('Delete this workout log?')){state.workoutLogs=state.workoutLogs.filter(x=>x.id!==el.dataset.removeWorkout);save();render()}});document.querySelectorAll('[data-remove-measure]').forEach(el=>el.onclick=()=>{if(confirm('Delete this measurement?')){state.measurements=state.measurements.filter(x=>x.date!==el.dataset.measureDate);save();render()}});let cp=document.getElementById('copyPlan');if(cp)cp.onclick=()=>{const content='Please revise my flexible fitness schedule. My goal is a lean athletic physique. Return ONLY a JSON array of 1 to 20 sessions, each with a unique id, name, type (Strength, Swimming, Water polo, Cycling, Pilates, Running, Walking or Other), weekday (Monday through Sunday or Unscheduled), focus and exercises formatted as [name, sets, reps] for strength workouts. Swimming, water polo and other sports can have an empty exercises list. Here is my current plan: '+JSON.stringify(WORKOUTS);navigator.clipboard.writeText(content).then(()=>alert('Copied. Paste into ChatGPT and describe what you want changed.')).catch(()=>alert('Clipboard not available in this browser.'))};let ap=document.getElementById('applyPlan');if(ap)ap.onclick=()=>{try{const raw=document.getElementById('planJson').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const parsed=JSON.parse(raw);const valid=validWorkouts(Array.isArray(parsed)?parsed:parsed.workouts);if(!confirm('Replace your current workouts? Existing completed workout logs will be retained.'))return;WORKOUTS=valid;save();chosenWorkout='A';render();alert('Your new workouts are ready!')}catch(err){alert('Invalid workout plan: '+err.message)}};let reset=document.getElementById('resetAllWorkouts');if(reset)reset.onclick=()=>{if(confirm('Restore the original 3-day workout plan? Past workout logs will stay.')){WORKOUTS=structuredClone(ORIGINAL_WORKOUTS);save();render()}};let restore=document.getElementById('restoreWorkout');if(restore)restore.onclick=()=>{const original=ORIGINAL_WORKOUTS.find(x=>x.id===modal.id);if(confirm('Restore the original '+original.weekday+' workout?')){WORKOUTS=WORKOUTS.map(x=>x.id===original.id?structuredClone(original):x);save();modal=null;render()}};const removeActivity=document.getElementById('deleteActivity');if(removeActivity)removeActivity.onclick=()=>{if(WORKOUTS.length<=1){alert('Keep at least one session.');return}if(confirm('Remove this session from your schedule? Completed logs remain.')){WORKOUTS=WORKOUTS.filter(x=>x.id!==modal.id);chosenWorkout=WORKOUTS[0].id;save();modal=null;render()}};let f=document.getElementById('settingsForm');if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f);for(let key of ['proteinGoal','stepGoal','waterGoal','goalBodyFat'])state.profile[key]=Number(fd.get(key));save();alert('Your goals have been saved.');render()};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lachlans-fitness-hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};let imp=document.getElementById('importFile');if(imp)imp.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed.profile||!Array.isArray(parsed.measurements)||!Array.isArray(parsed.meals)||!Array.isArray(parsed.workoutLogs))throw Error('Backup data format not recognised');if(confirm('Importing replaces all current app data. Continue?')){state={...structuredClone(defaults),...parsed,profile:{...defaults.profile,...parsed.profile}};if(parsed.customWorkouts)WORKOUTS=validWorkouts(parsed.customWorkouts);else WORKOUTS=structuredClone(ORIGINAL_WORKOUTS);chosenWorkout=WORKOUTS[0].id;save();render();alert('Backup imported successfully.')}}catch(err){alert('Could not import file: '+err.message)}};let clear=document.getElementById('clearBtn');if(clear)clear.onclick=()=>{if(confirm('Reset ALL food, workout and progress logs? This cannot be undone unless you exported a backup.')){localStorage.removeItem(KEY);state=structuredClone(defaults);WORKOUTS=structuredClone(ORIGINAL_WORKOUTS);render()}};}
