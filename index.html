<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fitness Hub"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Lachlan's Fitness Hub</title><style>
:root{--bg:#0c1513;--surface:#17231f;--surface2:#20302a;--fg:#f4f6ee;--muted:#a4b7ad;--line:#34443c;--lime:#c5ef83;--orange:#efb575;--red:#f3a59d}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}button:disabled{opacity:.5}#app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(104px + env(safe-area-inset-bottom))}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:800}.brand{font-size:29px;line-height:1.12;font-weight:790;letter-spacing:-1.2px;margin:7px 0 4px}.subtitle{color:var(--muted);font-size:13px;line-height:1.55}.avatar{width:44px;height:44px;border-radius:14px;background:var(--lime);color:#15211b;display:grid;place-items:center;font-size:20px;font-weight:900}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 11px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.4px}.section-head small{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:21px;padding:17px;margin:11px 0}.hero{background:linear-gradient(135deg,#23362b,#1b3025 58%,#33452b);border-color:#476546}.hero h1{font-size:39px;line-height:1;margin:12px 0 8px;letter-spacing:-1.6px}.hero .tag{display:inline-block;background:#c5ef8325;border:1px solid #8cb96a66;color:var(--lime);font-size:11px;padding:7px 10px;border-radius:999px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row.top{align-items:flex-start}.stack{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:16px;min-width:0}.metric .label{font-size:11px;color:var(--muted);line-height:1.3}.metric .value{font-size:26px;letter-spacing:-.9px;font-weight:800;margin:9px 0 3px;white-space:nowrap}.metric .note{font-size:11px;color:var(--lime)}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.pill{display:inline-block;border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:6px 10px;font-size:11px;color:var(--muted)}.pill.good{color:var(--lime);border-color:#526a48}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);border:0;color:#172019;font-weight:800;padding:12px 15px;border-radius:13px;min-height:43px}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--fg)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.sm{padding:8px 11px;min-height:35px;font-size:12px}.btn.full{width:100%}input,select,textarea{width:100%;background:#101c18;border:1px solid #405449;border-radius:12px;color:var(--fg);padding:12px;min-height:44px}input::placeholder,textarea::placeholder{color:#84978d}input[type=date]{color-scheme:dark}input[type=number]{font-variant-numeric:tabular-nums}label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .wide{grid-column:span 2}.progress{height:9px;background:#34453b;border-radius:999px;overflow:hidden}.progress span{height:100%;background:var(--lime);display:block;border-radius:999px;transition:width .25s}.progress-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.workout-item{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}.workout-item:last-child{border:0}.workout-item .num{flex:none;width:27px;height:27px;display:grid;place-items:center;background:#2c4235;color:var(--lime);border-radius:10px;font-weight:800;font-size:11px}.workout-item .left{display:flex;align-items:center;gap:9px;min-width:0}.workout-item b{display:block;font-size:13px}.workout-item small{color:var(--muted);font-size:11px}.workout-item .sets{color:var(--lime);font-size:11px;white-space:nowrap}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#121f1aeF;backdrop-filter:blur(17px);border-top:1px solid var(--line);padding:9px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:center}.tabs-inner{width:min(650px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.tab{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:7px 2px 5px;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:10px}.tab span{font-size:21px;line-height:1.2}.tab.active{background:#273e31;color:var(--lime)}.chiprow{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px}.chip{padding:10px 13px;flex:none;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12px}.chip.active{background:var(--lime);border-color:var(--lime);color:var(--bg)}.callout{font-size:12px;color:#d7e1d8;line-height:1.6;background:#26392e;border-left:3px solid var(--lime);padding:12px 13px;border-radius:6px 12px 12px 6px;margin:13px 0}.chart{width:100%;height:170px;display:block}.linegrid{stroke:#33473b;stroke-width:1}.chartlabel{fill:#9eb3a5;font:11px -apple-system,sans-serif}.footnote{font-size:11px;color:var(--muted);line-height:1.55}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.statline{border-bottom:1px solid var(--line);padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.statline:last-child{border:0}.log-entry{border-bottom:1px solid var(--line);padding:11px 0}.log-entry:last-child{border:0}.log-entry .date{font-size:11px;color:var(--muted)}.log-entry b{font-size:14px}.remove{background:transparent;border:0;color:var(--red);padding:4px 6px}.checkrow{display:flex;gap:9px;align-items:center;padding:8px 0;color:var(--fg);font-size:13px}.checkrow input{width:17px;min-height:0;height:17px;accent-color:var(--lime)}.divider{height:1px;background:var(--line);margin:14px 0}.empty{font-size:13px;color:var(--muted);padding:14px 0}.modal-backdrop{position:fixed;inset:0;background:#020705d9;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#1b2c24;border:1px solid #4d6956;border-radius:24px 24px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 8px;font-size:22px}.exercise-log{border-bottom:1px solid var(--line);padding:12px 0}.exercise-log:last-child{border:0}.setrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:9px;align-items:center;margin-top:8px}.setrow small{color:var(--muted)}.setrow input{padding:9px;min-height:40px}.upload{position:relative;overflow:hidden}.upload input{position:absolute;opacity:0;inset:0;cursor:pointer}.fineprint{color:#8fa99a;font-size:11px;line-height:1.5}.warning{color:var(--orange)}@media(min-width:650px){#app{padding-top:38px}.tabs{bottom:12px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-radius:22px;padding:8px;width:630px}.modal-backdrop{align-items:center}.modal{border-radius:24px;max-height:85vh}}
</style></head><body><main id="app"></main><nav class="tabs" aria-label="Main navigation"><div class="tabs-inner" id="tabbar"></div></nav><div id="modalroot"></div><script>
'use strict';
const KEY='lachlan_fitness_hub_v1';
const WORKOUTS=[{id:'A',name:'Full Body A',focus:'Chest, back & quads',weekday:'Monday',exercises:[['Goblet squat',2,'8–12'],['Dumbbell bench press',2,'8–12'],['One-arm dumbbell row',2,'10–12 / side'],['Dumbbell Romanian deadlift',2,'8–12'],['Dumbbell lateral raise',2,'12–15'],['Plank',2,'20–40 sec']]},{id:'B',name:'Full Body B',focus:'Legs, shoulders & arms',weekday:'Wednesday',exercises:[['Trap-bar deadlift',2,'6–8'],['Dumbbell shoulder press',2,'8–12'],['Band-assisted pull-up or band row',2,'8–12'],['Split squat',2,'8–10 / side'],['Dumbbell biceps curl',2,'10–15'],['Dumbbell triceps extension',2,'10–15']]},{id:'C',name:'Full Body C',focus:'Full-body strength',weekday:'Friday',exercises:[['Goblet squat',2,'10–12'],['Incline dumbbell press',2,'8–12'],['Barbell row',2,'8–12'],['Dumbbell hip thrust',2,'10–15'],['Dumbbell lateral raise',2,'12–15'],['Dead bug',2,'8–10 / side']]}];
const defaults={profile:{weight:95.8,bodyFat:26.8,fatMass:25.7,muscleMass:67.7,leanMass:71.3,steps:6920,goalBodyFat:15,proteinGoal:140,stepGoal:8000,waterGoal:2500},measurements:[{date:'2026-11-15',weight:95.8,bodyFat:26.8,muscle:67.7,waist:null}],meals:[],workoutLogs:[],water:[],steps:[],notes:[],createdAt:new Date().toISOString()};
function load(){try{let stored=JSON.parse(localStorage.getItem(KEY));if(stored&&stored.profile)return {...structuredClone(defaults),...stored,profile:{...defaults.profile,...stored.profile}}}catch(e){}return structuredClone(defaults)}let state=load(),tab='home',chosenWorkout='A',modal=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v,dec=0){return typeof v==='number'&&isFinite(v)?v.toFixed(dec):'—'}function sum(arr,k){return arr.reduce((s,a)=>s+(Number(a[k])||0),0)}function currentMeasurement(){return [...state.measurements].sort((a,b)=>a.date.localeCompare(b.date)).at(-1)||{weight:95.8,bodyFat:26.8}}function dailyMeals(date=today()){return state.meals.filter(m=>m.date===date)}function dailyWater(date=today()){return sum(state.water.filter(w=>w.date===date),'ml')}function dailySteps(date=today()){return state.steps.filter(w=>w.date===date).at(-1)?.count||0}function currentProtein(){return sum(dailyMeals(),'protein')}function render(){const labels=[['home','⌂','Today'],['workouts','◫','Train'],['progress','↗','Progress'],['nutrition','◉','Food'],['settings','⚙','More']];document.getElementById('tabbar').innerHTML=labels.map(([id,icon,title])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}" aria-label="${title}" aria-current="${tab===id?'page':'false'}"><span>${icon}</span>${title}</button>`).join('');let map={home:renderHome,workouts:renderWorkouts,progress:renderProgress,nutrition:renderNutrition,settings:renderSettings};document.getElementById('app').innerHTML=map[tab]();bind();renderModal()}function heading(name,desc){return `<div class="topline"><div><div class="eyebrow">Lachlan's fitness hub</div><h1 class="brand">${name}</h1><div class="subtitle">${desc}</div></div><div class="avatar">L</div></div>`}function metric(label,val,note){return `<div class="metric"><div class="label">${label}</div><div class="value">${val}</div><div class="note">${note}</div></div>`}function progressBar(value,goal){return `<div class="progress"><span style="width:${Math.min(100,Math.max(0,goal?value/goal*100:0))}%"></span></div>`}function prettyDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})}function getRecommended(){let d=new Date().getDay();return d===3?'B':d===5?'C':'A'}function renderHome(){let m=currentMeasurement(),p=state.profile,protein=currentProtein(),water=dailyWater(),steps=dailySteps(),recent=state.workoutLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,1)[0],recommended=WORKOUTS.find(w=>w.id===getRecommended());return heading('Your daily game plan','Build strength. Lose fat. Stay consistent.')+`<section class="card hero"><span class="tag">LEAN & ATHLETIC • 15% BODY FAT GOAL</span><h1>${num(m.weight,1)} <span style="font-size:22px">kg</span></h1><div class="subtitle" style="color:#d5e3d4">Current logged weight · estimated body fat ${num(m.bodyFat,1)}%</div><div class="divider"></div><div class="row"><span class="small">Your target is body composition, not just scale weight.</span><button class="btn sm" data-modal="measure">+ Weigh in</button></div></section><div class="section-head"><h2>Today at a glance</h2><small>${prettyDate(today())}</small></div><div class="grid2">${metric('Protein',`${num(protein)} / ${p.proteinGoal} g`,`${Math.max(0,p.proteinGoal-protein)} g remaining`)}${metric('Water',`${(water/1000).toFixed(1)} L`,`${(p.waterGoal/1000).toFixed(1)} L daily goal`)}${metric('Steps',`${steps||'—'}`,`Goal ${p.stepGoal.toLocaleString()}`)}${metric('Workouts logged',`${state.workoutLogs.length}`,`Total completed`)}</div><div class="card"><div class="progress-label"><b>Protein today</b><span>${Math.round(protein/Math.max(1,p.proteinGoal)*100)}%</span></div>${progressBar(protein,p.proteinGoal)}<div class="row" style="margin-top:13px"><button class="btn sm secondary" data-tab="nutrition">+ Log food</button><button class="btn sm secondary" data-water="250">+ 250 mL water</button></div></div><div class="section-head"><h2>Next workout</h2><small>3 days a week</small></div><div class="card"><div class="row top"><div><span class="pill good">${recommended.weekday}</span><h2 style="margin:10px 0 4px">${recommended.name}</h2><div class="subtitle">${recommended.focus} · ${recommended.exercises.length} exercises</div></div><span style="font-size:32px;color:var(--lime)">↗</span></div><button class="btn full" style="margin-top:17px" data-start="${recommended.id}">Start workout</button></div><div class="callout"><b>Your key priority:</b> Rebuild lifting consistency while eating enough protein. Your Withings scale estimated a 2.4 kg muscle-mass decline during its report period, but hydration changes affect these readings.</div>${recent?`<div class="section-head"><h2>Last session</h2></div><div class="card row"><div><b>${escapeHTML(recent.name)}</b><div class="subtitle">${prettyDate(recent.date)} · ${recent.entries.length} exercises logged</div></div><span class="pill good">Completed</span></div>`:''}`}
function renderWorkouts(){let w=WORKOUTS.find(x=>x.id===chosenWorkout);return heading('Your training','Home gym • Three full-body days')+`<div class="chiprow">${WORKOUTS.map(x=>`<button class="chip ${x.id===chosenWorkout?'active':''}" data-workout="${x.id}">${x.weekday}</button>`).join('')}</div><div class="card hero"><span class="tag">${w.weekday.toUpperCase()}</span><h1 style="font-size:30px">${w.name}</h1><div class="subtitle">${w.focus} · approximately 45–60 minutes</div><button class="btn full" style="margin-top:18px" data-start="${w.id}">Start & log session</button></div><div class="section-head"><h2>Workout exercises</h2><small>2 sets each to start</small></div><div class="card">${w.exercises.map((e,i)=>`<div class="workout-item"><div class="left"><span class="num">${i+1}</span><div><b>${escapeHTML(e[0])}</b><small>Controlled movement • 2–3 reps in reserve</small></div></div><span class="sets">${e[1]} × ${e[2]}</span></div>`).join('')}</div><div class="callout">Warm up for 5–8 minutes on your bike, then do lighter sets before heavy lifts. Start conservatively after your time away. Avoid heavy barbell lifting alone without correctly installed safety supports.</div><div class="section-head"><h2>Recent sessions</h2></div><div class="card">${state.workoutLogs.length?state.workoutLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(x=>`<div class="log-entry row"><div><b>${escapeHTML(x.name)}</b><div class="date">${prettyDate(x.date)} · ${x.entries.length} movements</div></div><button class="remove" aria-label="Delete workout" data-remove-workout="${x.id}">Delete</button></div>`).join(''):`<div class="empty">Your completed workouts will appear here.</div>`}</div>`}
function chartSVG(rows,key,unit){let points=rows.filter(x=>Number.isFinite(Number(x[key]))&&x[key]!==null).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-15);if(!points.length)return '<p class="empty">Add a measurement to see your chart.</p>';let vals=points.map(x=>Number(x[key]));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}else{let pad=Math.max(.4,(max-min)*.22);min-=pad;max+=pad}let pt=(v,i)=>[(30+i*(280/Math.max(1,points.length-1))).toFixed(1),(146-((v-min)/(max-min))*112).toFixed(1)];let coords=vals.map((v,i)=>pt(v,i));return `<svg class="chart" viewBox="0 0 335 170" role="img" aria-label="${escapeHTML(key)} trend chart"><line class="linegrid" x1="30" y1="20" x2="310" y2="20"/><line class="linegrid" x1="30" y1="83" x2="310" y2="83"/><line class="linegrid" x1="30" y1="146" x2="310" y2="146"/><text class="chartlabel" x="0" y="24">${max.toFixed(1)}</text><text class="chartlabel" x="0" y="150">${min.toFixed(1)}</text><polyline fill="none" stroke="#c5ef83" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${coords.map(c=>c.join(',')).join(' ')}"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.6" fill="#c5ef83"/>`).join('')}<text class="chartlabel" x="30" y="165">${prettyDate(points[0].date)}</text><text class="chartlabel" x="310" y="165" text-anchor="end">${prettyDate(points.at(-1).date)}</text></svg>`}
function renderProgress(){let m=currentMeasurement(),goal=state.profile.goalBodyFat,lean=m.weight*(1-m.bodyFat/100),target=lean/(1-goal/100);return heading('Your progress','Look at trends, strength and consistency.')+`<div class="grid2">${metric('Current weight',`${num(m.weight,1)} kg`,'Latest measurement')}${metric('Estimated fat',`${num(m.bodyFat,1)}%`,`Goal ${goal}%`)}${metric('Muscle estimate',m.muscle!=null?`${num(m.muscle,1)} kg`:'—','Hydration can affect this')}${metric('Waist',m.waist!=null?`${num(m.waist,1)} cm`:'—','Track weekly')}</div><div class="card"><div class="row"><h2 style="margin:0">Weight trend</h2><span class="pill">kg</span></div>${chartSVG(state.measurements,'weight','kg')}</div><div class="card"><div class="row"><h2 style="margin:0">Body fat estimate</h2><span class="pill">%</span></div>${chartSVG(state.measurements,'bodyFat','%')}</div><div class="card"><div class="row"><h2 style="margin:0">Waist trend</h2><span class="pill">cm</span></div>${chartSVG(state.measurements,'waist','cm')}</div><div class="callout">If your scale's fat-free-mass estimate were accurate and stayed constant, ${goal}% body fat would correspond to roughly <b>${isFinite(target)?target.toFixed(1):'—'} kg</b>. This is not a required scale weight: you may gain muscle, and smart-scale estimates are imprecise.</div><button class="btn full" data-modal="measure">+ Add measurement</button><div class="section-head"><h2>Measurement history</h2></div><div class="card">${state.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>`<div class="log-entry row"><div><b>${num(x.weight,1)} kg</b><div class="date">${prettyDate(x.date)} · ${x.bodyFat==null?'Body fat not entered':num(x.bodyFat,1)+'% fat'}${x.waist!=null?' · '+num(x.waist,1)+' cm waist':''}</div></div>${state.measurements.length>1?`<button class="remove" data-remove-measure="${escapeHTML(x.id||'initial')}" data-measure-date="${x.date}">Delete</button>`:''}</div>`).join('')}</div><p class="footnote">Starting data: Withings report dated 15 Nov 2026. The report provided latest weight 95.8 kg, fat mass 25.7 kg and muscle mass 67.7 kg. Body fat of 26.8% was calculated from fat mass divided by total weight. No earlier individual weigh-in dates were available in the report.</p>`}
function renderNutrition(){let meals=dailyMeals(),protein=sum(meals,'protein'),cal=sum(meals,'calories'),water=dailyWater(),steps=dailySteps(),p=state.profile;return heading('Food & recovery','Fuel training while Mounjaro reduces appetite.')+`<div class="grid2">${metric('Protein today',`${num(protein)} g`,`Goal ${p.proteinGoal} g`)}${metric('Food calories',`${num(cal)}`,'Logged, not prescribed')}${metric('Water today',`${(water/1000).toFixed(2)} L`,'Tap below to add')}${metric('Steps today',steps?steps.toLocaleString():'—',`Goal ${p.stepGoal.toLocaleString()}`)}</div><div class="card"><div class="progress-label"><b>Protein</b><span>${num(protein)} / ${p.proteinGoal} g</span></div>${progressBar(protein,p.proteinGoal)}<div style="height:15px"></div><div class="progress-label"><b>Water</b><span>${water} / ${p.waterGoal} mL</span></div>${progressBar(water,p.waterGoal)}<div class="row" style="margin-top:13px"><button class="btn sm secondary" data-water="250">+ 250 mL</button><button class="btn sm secondary" data-water="500">+ 500 mL</button><button class="btn sm secondary" data-modal="steps">Log steps</button></div></div><button class="btn full" data-modal="meal">+ Log a meal or snack</button><div class="section-head"><h2>Today's food</h2><small>${prettyDate(today())}</small></div><div class="card">${meals.length?meals.map(m=>`<div class="log-entry row"><div><b>${escapeHTML(m.name)}</b><div class="date">${num(m.protein)} g protein · ${num(m.calories)} kcal</div></div><button class="remove" aria-label="Remove meal" data-remove-meal="${m.id}">Delete</button></div>`).join(''):`<div class="empty">Nothing logged today. Start with your next meal or protein shake.</div>`}</div><div class="callout"><b>Important:</b> Your Withings report showed rapid recent weight loss. Because you're eating only two small meals while taking Mounjaro 2.5 mg, don't force an extra calorie deficit. Speak with your prescriber or dietitian if you cannot meet nutritional needs, feel weak or dehydrated.</div><div class="section-head"><h2>Recent meals</h2></div><div class="card">${state.meals.filter(x=>x.date!==today()).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(m=>`<div class="log-entry"><b>${escapeHTML(m.name)}</b><div class="date">${prettyDate(m.date)} · ${num(m.protein)} g protein · ${num(m.calories)} kcal</div></div>`).join('')||'<div class="empty">Past food entries appear here.</div>'}</div>`}
function renderSettings(){let p=state.profile;return heading('Your settings','Personalise targets and keep a backup.')+`<div class="card"><h2 style="margin-top:0">Daily targets</h2><form id="settingsForm" class="form-grid"><div><label for="proteinGoal">Protein (g)</label><input id="proteinGoal" name="proteinGoal" type="number" min="1" max="350" value="${p.proteinGoal}" required></div><div><label for="stepGoal">Steps</label><input id="stepGoal" name="stepGoal" type="number" min="100" max="50000" value="${p.stepGoal}" required></div><div><label for="waterGoal">Water (mL)</label><input id="waterGoal" name="waterGoal" type="number" min="100" max="8000" value="${p.waterGoal}" required></div><div><label for="goalBodyFat">Goal body fat (%)</label><input id="goalBodyFat" name="goalBodyFat" type="number" step="0.1" min="5" max="60" value="${p.goalBodyFat}" required></div><button class="btn wide" type="submit">Save goals</button></form></div><div class="card"><h2 style="margin-top:0">Your baseline</h2><div class="statline"><span class="muted">Withings report</span><b>15 Oct – 15 Nov 2026</b></div><div class="statline"><span class="muted">Body weight</span><b>95.8 kg</b></div><div class="statline"><span class="muted">Fat mass</span><b>25.7 kg</b></div><div class="statline"><span class="muted">Estimated muscle mass</span><b>67.7 kg</b></div><div class="statline"><span class="muted">Activity baseline</span><b>6,920 steps/day</b></div><div class="statline"><span class="muted">Training plan</span><b>3 days/week</b></div><div class="statline"><span class="muted">Medication context</span><b>Mounjaro 2.5 mg</b></div></div><div class="card"><h2 style="margin-top:0">Your data</h2><div class="subtitle">Data is stored locally in this browser on this device. It is not synced to ChatGPT, Withings or Apple Health. Back it up before changing phones, clearing Safari data or reinstalling.</div><div class="stack" style="margin-top:15px"><button class="btn secondary full" id="exportBtn">↓ Export backup (JSON)</button><label class="btn secondary full upload" style="color:var(--fg);margin:0">↑ Import backup (JSON)<input id="importFile" type="file" accept="application/json,.json"></label><button class="btn ghost full" id="clearBtn">Reset all locally saved entries</button></div></div><p class="footnote">This is a self-tracking tool, not medical advice or a medical device. Body fat values are approximate. Always follow your healthcare professional's instructions regarding Mounjaro and nutrition.</p>`}
function renderModal(){let root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let html='';if(modal.type==='measure'){let m=currentMeasurement();html=`<h2>Add measurement</h2><p class="subtitle">Morning weigh-ins under consistent conditions are most useful.</p><form id="measureForm" class="form-grid"><div class="wide"><label>Date</label><input name="date" type="date" value="${today()}" max="${today()}" required></div><div><label>Weight (kg) *</label><input name="weight" type="number" step="0.1" min="30" max="350" placeholder="e.g. 95.4" required></div><div><label>Body fat (%)</label><input name="bodyFat" type="number" step="0.1" min="2" max="70" placeholder="Optional"></div><div><label>Muscle mass (kg)</label><input name="muscle" type="number" step="0.1" min="10" max="180" placeholder="Optional"></div><div><label>Waist (cm)</label><input name="waist" type="number" step="0.1" min="40" max="200" placeholder="Optional"></div><button class="btn wide" type="submit">Save measurement</button></form>`}else if(modal.type==='meal'){html=`<h2>Log food</h2><p class="subtitle">Approximate amounts are fine. Calories and protein must be entered manually.</p><form id="mealForm" class="form-grid"><div class="wide"><label>Food / drink</label><input name="name" placeholder="e.g. Chicken & rice, protein shake" maxlength="90" required></div><div><label>Protein (g)</label><input type="number" name="protein" min="0" max="300" step="0.1" placeholder="e.g. 40" required></div><div><label>Calories (kcal)</label><input type="number" name="calories" min="0" max="5000" step="1" placeholder="e.g. 500" required></div><div class="wide"><label>Date</label><input type="date" name="date" value="${today()}" required></div><button class="btn wide" type="submit">Save food entry</button></form>`}else if(modal.type==='steps'){html=`<h2>Log steps</h2><form id="stepForm" class="stack"><div><label>Steps today</label><input name="count" type="number" min="0" max="100000" placeholder="e.g. 7800" required></div><button class="btn full" type="submit">Save steps</button></form>`}else if(modal.type==='workout'){let w=WORKOUTS.find(x=>x.id===modal.id);html=`<h2>${w.name}</h2><p class="subtitle">${w.focus}. Log the weight and reps for each set. For plank or dead bug, leave weight at 0 and use seconds or reps.</p><form id="workoutForm"><label>Date</label><input name="date" type="date" value="${today()}" required>${w.exercises.map((e,i)=>`<div class="exercise-log"><b>${escapeHTML(e[0])}</b><div class="subtitle">${e[1]} sets · target ${e[2]}</div>${Array.from({length:e[1]},(_,j)=>`<div class="setrow"><small>Set ${j+1}</small><input aria-label="Weight for ${escapeHTML(e[0])} set ${j+1}" name="w_${i}_${j}" type="number" min="0" max="600" step="0.5" placeholder="kg"><input aria-label="Reps or seconds for ${escapeHTML(e[0])} set ${j+1}" name="r_${i}_${j}" type="number" min="0" max="300" step="1" placeholder="reps/sec"></div>`).join('')}</div>`).join('')}<button class="btn full" style="margin-top:16px" type="submit">Complete & save workout</button></form>`}root.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="row" style="margin-bottom:12px"><div class="eyebrow">Log your progress</div><button class="btn sm ghost" id="closeModal" type="button">✕ Close</button></div>${html}</section></div>`;let forms=['measureForm','mealForm','stepForm','workoutForm'];forms.forEach(id=>{let node=document.getElementById(id);if(node)node.addEventListener('submit',handleForm)})}
function handleForm(ev){ev.preventDefault();const form=ev.currentTarget,f=new FormData(form),id=form.id,uuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);if(id==='measureForm'){let entry={id:uuid(),date:f.get('date'),weight:Number(f.get('weight')),bodyFat:f.get('bodyFat')===''?null:Number(f.get('bodyFat')),muscle:f.get('muscle')===''?null:Number(f.get('muscle')),waist:f.get('waist')===''?null:Number(f.get('waist'))};state.measurements.push(entry);tab='progress'}else if(id==='mealForm'){state.meals.push({id:uuid(),name:String(f.get('name')).trim(),protein:Number(f.get('protein')),calories:Number(f.get('calories')),date:f.get('date')});tab='nutrition'}else if(id==='stepForm'){state.steps=state.steps.filter(x=>x.date!==today());state.steps.push({date:today(),count:Number(f.get('count'))});tab='nutrition'}else if(id==='workoutForm'){let w=WORKOUTS.find(x=>x.id===modal.id),entries=w.exercises.map((e,i)=>({name:e[0],sets:Array.from({length:e[1]},(_,j)=>({weight:Number(f.get(`w_${i}_${j}`))||0,reps:Number(f.get(`r_${i}_${j}`))||0}))}));state.workoutLogs.push({id:uuid(),date:f.get('date'),name:w.name,workoutId:w.id,entries});tab='workouts'}save();modal=null;render()}
function bind(){document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render();window.scrollTo(0,0)});document.querySelectorAll('[data-workout]').forEach(el=>el.onclick=()=>{chosenWorkout=el.dataset.workout;render()});document.querySelectorAll('[data-modal]').forEach(el=>el.onclick=()=>{modal={type:el.dataset.modal};renderModal()});document.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>{chosenWorkout=el.dataset.start;modal={type:'workout',id:chosenWorkout};renderModal()});document.querySelectorAll('[data-water]').forEach(el=>el.onclick=()=>{state.water.push({id:Date.now().toString(36)+Math.random(),date:today(),ml:Number(el.dataset.water)});save();render()});document.querySelectorAll('[data-remove-meal]').forEach(el=>el.onclick=()=>{if(confirm('Delete this food entry?')){state.meals=state.meals.filter(x=>x.id!==el.dataset.removeMeal);save();render()}});document.querySelectorAll('[data-remove-workout]').forEach(el=>el.onclick=()=>{if(confirm('Delete this workout log?')){state.workoutLogs=state.workoutLogs.filter(x=>x.id!==el.dataset.removeWorkout);save();render()}});document.querySelectorAll('[data-remove-measure]').forEach(el=>el.onclick=()=>{if(confirm('Delete this measurement?')){state.measurements=state.measurements.filter(x=>x.date!==el.dataset.measureDate);save();render()}});let f=document.getElementById('settingsForm');if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f);for(let key of ['proteinGoal','stepGoal','waterGoal','goalBodyFat'])state.profile[key]=Number(fd.get(key));save();alert('Your goals have been saved.');render()};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lachlans-fitness-hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};let imp=document.getElementById('importFile');if(imp)imp.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed.profile||!Array.isArray(parsed.measurements)||!Array.isArray(parsed.meals)||!Array.isArray(parsed.workoutLogs))throw Error('Backup data format not recognised');if(confirm('Importing replaces all current app data. Continue?')){state={...structuredClone(defaults),...parsed,profile:{...defaults.profile,...parsed.profile}};save();render();alert('Backup imported successfully.')}}catch(err){alert('Could not import file: '+err.message)}};let clear=document.getElementById('clearBtn');if(clear)clear.onclick=()=>{if(confirm('Reset ALL food, workout and progress logs? This cannot be undone unless you exported a backup.')){localStorage.removeItem(KEY);state=structuredClone(defaults);render()}};let close=document.getElementById('closeModal');if(close)close.onclick=()=>{modal=null;renderModal()};let bd=document.getElementById('backdrop');if(bd)bd.onclick=e=>{if(e.target===bd){modal=null;renderModal()}}}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
