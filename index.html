function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v,dec=0){return typeof v==='number'&&isFinite(v)?v.toFixed(dec):'—'}function sum(arr,k){return arr.reduce((s,a)=>s+(Number(a[k])||0),0)}function currentMeasurement(){return [...state.measurements].sort((a,b)=>a.date.localeCompare(b.date)).at(-1)||{weight:95.8,bodyFat:26.8}}function dailyMeals(date=today()){return state.meals.filter(m=>m.date===date)}function dailyWater(date=today()){return sum(state.water.filter(w=>w.date===date),'ml')}function dailySteps(date=today()){return state.steps.filter(w=>w.date===date).at(-1)?.count||0}function currentProtein(){return sum(dailyMeals(),'protein')}function render(){const labels=[['home',`<svg class="nav-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,'Today'],['workouts',`<svg class="nav-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M18 6v12M3 8v8M21 8v8M6 12h12"/><path d="M4 8H2v8h2M20 8h2v8h-2"/></svg>`,'Train'],['progress',`<svg class="nav-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11h4v9M10 20V7h4v13M16 20V3h4v17"/><path d="M3 20h18"/></svg>`,'Progress'],['nutrition',`<svg class="nav-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8c-1.5-2.5 // Fitness Hub scores v1. Research-inspired indicators, NOT clinical or Bevel scores.
// Score components are kept transparent and are withheld for missing data.
function scoreClamp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function calculateHealthScores(){
 const days=Object.values(state.healthSamples||{}).sort((a,b)=>a.date.localeCompare(b.date));
 const out={};
 for(let i=0;i<days.length;i++){
  const d=days[i],record={};
  if(d.sleep?.asleepMinutes>0&&d.sleep?.inBedMinutes>=d.sleep.asleepMinutes){
   const hours=d.sleep.asleepMinutes/60,efficiency=d.sleep.asleepMinutes/d.sleep.inBedMinutes;
   const duration=hours<7?Math.max(0,100-(7-hours)*25):hours<=9?100:Math.max(0,100-(hours-9)*15);
   record.sleep=scoreClamp(duration*0.65+scoreClamp((efficiency-0.6)/0.35*100)*0.35);
  }
  // Strain reflects activity load, with active zone minutes weighted above steps.
  // No active zone minutes reading = no strain estimate; missing is not zero.
  if(Number.isFinite(d.zoneMinutes)){
   const steps=state.steps.find(x=>x.date===d.date)?.count;
   if(Number.isFinite(steps))record.strain=scoreClamp(100*(1-Math.exp(-(d.zoneMinutes/55+steps/35000))));
  }
  // Recovery requires at least 7 PRIOR HRV and resting HR observations.
  const prev=days.slice(Math.max(0,i-28),i);
  const h=prev.filter(x=>Number.isFinite(x.hrv)&&x.hrv>0).map(x=>x.hrv);
  const r=prev.filter(x=>Number.isFinite(x.rhr)&&x.rhr>0).map(x=>x.rhr);
  if(h.length>=7&&r.length>=7&&Number.isFinite(d.hrv)&&Number.isFinite(d.rhr)&&Number.isFinite(record.sleep)){
   const median=a=>{const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
   const hbase=median(h),rbase=median(r);
   const hscore=scoreClamp(65+(d.hrv/hbase-1)*180);
   const rscore=scoreClamp(65+(1-d.rhr/rbase)*240);
   record.recovery=scoreClamp(hscore*0.4+rscore*0.35+record.sleep*0.25);
  }
  out[d.date]=record;
 }
 state.healthDaily=out;
}
function healthSample(date=today()){return state.healthSamples?.[date]||{}}

}
async function googleSyncWellbeing(){
 const key=document.getElementById('withingsSyncKey');if(key)withingsKey=key.value.trim();
 googleBusy=true;googleMessage='Importing sleep and recovery measurements…';render();
 try{
  const [data,stepData]=await Promise.all([withingsRequest('/api/google/wellbeing'),withingsRequest('/api/google/steps')]);
  if(!Array.isArray(data.days))throw Error('Unexpected health data response');
  if(!state.healthSamples)state.healthSamples={};
  for(const d of data.days){if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))continue;
   const old=state.healthSamples[d.date]||{date:d.date};
   state.healthSamples[d.date]={...old,...d,date:d.date};
  }
  if(Array.isArray(stepData.days))for(const d of stepData.days){if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!Number.isSafeInteger(d.steps)||d.steps<0||d.steps>150000)continue;
    state.steps=state.steps.filter(x=>x.date!==d.date);state.steps.push({date:d.date,count:d.steps,source:'google'});
  }
  calculateHealthScores();state.googleLastSync=data.syncedAt||new Date().toISOString();save();
  const scoreDays=Object.values(state.healthDaily).filter(x=>Number.isFinite(x.sleep)||Number.isFinite(x.recovery)||Number.isFinite(x.strain)).length;
  googleMessage=`Imported ${data.days.length} dated Google Health records; calculated scores on ${scoreDays} days. ${data.warnings?.length?'Some sources could not be read: '+data.warnings.join('; '):'Open Today to see your scores.'}`;
 }catch(e){googleMessage='Google Health: '+(e.message||'Sync failed');}
 finally{googleBusy=false;render()}
}

async function withingsRequest(path,method='GET'){
 if(!withingsKey)throw new Error('Enter your Fitness Sync Key first.');
 const response=await fetch(WITHINGS_API+path,{method,headers:{Authorization:'Bearer '+withingsKey},cache:'no-store'});
 let data;try{data=await response.json()}catch{throw new Error('Could not read API response.')}
 if(!response.ok)throw new Error(data.error||('API error '+response.status));return data;
}
function importWithingsMeasurements(data){
 if(!Array.isArray(data.measurements))throw new Error('Unexpected measurements response.');
 let count=0;
 for(const m of data.measurements){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(m.date)||!Number.isFinite(m.weight)||m.weight<30||m.weight>350)continue;
  const old=state.measurements.find(x=>x.date===m.date);
  const update={date:m.date,weight:m.weight,source:'withings'};
  if(Number.isFinite(m.bodyFat)&&m.bodyFat>=2&&m.bodyFat<=70)update.bodyFat=m.bodyFat;
  if(Number.isFinite(m.muscle)&&m.muscle>=10&&m.muscle<=180)update.muscle=m.muscle;
  if(old)Object.assign(old,update);else state.measurements.push({...update,waist:null,id:'withings-'+m.date});
  count++;
 }
 state.withingsLastSync=data.syncedAt||new Date().toISOString();
 save();return count;
}

 if(!automatic){const field=document.getElementById('withingsSyncKey');if(field)withingsKey=field.value.trim()}

 withingsBusy=true;if(!automatic){withingsMessage='Contacting Withings…';render()}
 try{
  if(action==='connect'){
   const data=await withingsRequest('/api/connect','POST');const u=new URL(data.authorization_url);
   if(u.protocol!=='https:'||u.hostname!=='account.withings.com')throw new Error('Unexpected authorisation URL.');
   location.assign(u.href);return;

async function googleAction(action){
 if(googleBusy)return;
 const key=document.getElementById('withingsSyncKey');if(key)withingsKey=key.value.trim();
 googleBusy=true;googleMessage='Contacting Google Health…';render();
 try{
  if(action==='connect'){
   const data=await withingsRequest('/api/google/connect','POST');
   const target=new URL(data.authorization_url);
   if(target.protocol!=='https:'||target.hostname!=='accounts.google.com')throw Error('Unexpected Google sign-in address.');
   window.location.assign(target.href);return;
  }
  if(action==='status'){
   const data=await withingsRequest('/api/google/status');
   googleMessage=data.connected?'Google Health is connected. Tap Sync steps.':'Not connected yet. Tap Connect Google Health.';
  }
  if(action==='steps'){
   const data=await withingsRequest('/api/google/steps');
   if(!Array.isArray(data.days))throw Error('Unexpected activity response');
   let count=0;
   for(const day of data.days){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(day.date)||!Number.isSafeInteger(day.steps)||day.steps<0||day.steps>150000)continue;
    state.steps=state.steps.filter(x=>x.date!==day.date);
    state.steps.push({date:day.date,count:day.steps,source:'google'});
    count++;
   }
   state.googleLastSync=data.syncedAt||new Date().toISOString();save();
   googleMessage='Imported or updated '+count+' days of steps. See Today and Food for your daily step count.';
  }
 }catch(err){googleMessage='Google Health: '+(err.message||'Connection failed');}
 finally{googleBusy=false;render();}
}
